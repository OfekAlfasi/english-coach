<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- speech bubble -->
  <g filter="url(#sh)">
    <rect x="118" y="132" width="276" height="196" rx="40" fill="#ffffff"/>
    <path d="M188 316 L188 372 L244 316 Z" fill="#ffffff"/>
  </g>
  <!-- EC monogram -->
  <text x="256" y="256" font-family="Helvetica, Arial, sans-serif" font-size="132" font-weight="800"
        fill="#16a34a" text-anchor="middle" dominant-baseline="central" letter-spacing="4">EC</text>
  <!-- star accent (American flair) -->
  <path d="M256 372 l14 30 33 4 -24 23 6 33 -29 -16 -29 16 6 -33 -24 -23 33 -4 z" fill="#fbbf24"/>
</svg>
