<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#22c55e" />
    <meta name="description" content="Learn American English day-to-day: vocabulary, grammar, tenses, business & technical English, idioms & slang." />
    <title>English Coach — Learn American English</title>

    <!-- PWA / installable app -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="English Coach" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header id="topbar"></header>
    <main id="view"></main>
    <nav id="nav"></nav>

    <!-- content data (classic scripts: work by just opening the file) -->
    <script src="js/data/vocabulary.js"></script>
    <script src="js/data/business.js"></script>
    <script src="js/data/technical.js"></script>
    <script src="js/data/tenses.js"></script>
    <script src="js/data/grammar.js"></script>
    <script src="js/data/idioms.js"></script>
    <script src="js/data/curriculum.js"></script>
    <!-- engine -->
    <script src="js/store.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/games.js"></script>
    <script src="js/app.js"></script>

    <!-- register the service worker for offline / installable app -->
    <script>
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("service-worker.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
